<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixelator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pixelator</h1>
  <p>Turn any image into pixel art. Everything runs in your browser, with no AI.</p>

  <form id="controls">
    <label>Image <input type="file" id="file" accept="image/*"></label>
    <button type="button" id="sample">Try a sample</button>

    <label><span>Width: <output id="widthValue">64</output> px</span>
      <input type="range" id="width" min="8" max="256" value="64">
    </label>

    <label>Palette
      <select id="palette">
        <option value="auto">Auto (from image)</option>
        <option value="blackWhite">Black &amp; white</option>
        <option value="green">Handheld green</option>
        <option value="pico8">PICO-8</option>
      </select>
    </label>

    <label><span>Colours: <output id="colorsValue">16</output></span>
      <input type="range" id="colors" min="2" max="32" value="16">
    </label>

    <label class="checkbox"><input type="checkbox" id="dither"> Dithering</label>
    <button type="button" id="download" disabled>Download PNG</button>
  </form>

  <main id="output">Pick an image, or drop one anywhere on the page.</main>

  <script src="pixelate.js"></script>
  <script src="app.js"></script>
</body>
</html>
